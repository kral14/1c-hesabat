<!-- ========================================================
     1C:ENTERPRISE UNIVERSAL JOURNAL - НАСТРОЙКА СПИСКА (ОТБОР) WINDOW
     templates/components/universal_journal_filter_window.html
     ======================================================== -->

<div class="mdi-window" id="ujFilterWindow" style="display: none; top: 45px; left: 80px; width: 850px; height: 530px; min-width: 650px; min-height: 400px; z-index: 135;" onmousedown="MdiManager.activateWindow('ujFilterWindow')">
  
  <!-- Window Header -->
  <div class="mdi-window-header" ondblclick="MdiManager.toggleMaximize('ujFilterWindow')">
    <div class="mdi-win-title-left">
      <span class="mdi-win-icon">📑</span>
      <span class="mdi-win-title-text" id="ujFilterWindowTitle" data-i18n-skip>Настройка списка: Реализация товаров и услуг</span>
    </div>
    <div class="mdi-win-controls">
      <button class="mdi-win-btn mdi-win-btn-min" title="Qatla" onclick="MdiManager.minimizeWindow('ujFilterWindow')" onmousedown="event.stopPropagation()">_</button>
      <button class="mdi-win-btn mdi-win-btn-max" title="Böyüt / Bərpa et" onclick="MdiManager.toggleMaximize('ujFilterWindow')" onmousedown="event.stopPropagation()">□</button>
      <button class="mdi-win-btn mdi-win-btn-close" title="Bağla" onclick="UniversalJournal.closeFilterModal()" onmousedown="event.stopPropagation()">✕</button>
    </div>
  </div>

  <!-- Window Body -->
  <div class="mdi-window-body" style="background-color: #f0eee3; display: flex; flex-direction: column; height: 100%; overflow: hidden; font-family: Tahoma, 'MS Sans Serif', Arial, sans-serif; font-size: 11px;">
    
    <style>
      #ujFilterWindow select,
      #ujFilterWindow select option,
      #ujFilterWindow input[type="text"] {
        color: #111111 !important;
        background-color: #ffffff !important;
        -webkit-text-fill-color: #111111 !important;
      }
      #ujFilterCriteriaTbody td,
      #ujFilterCriteriaTbody td.c1-cell-active,
      #ujFilterCriteriaTbody td input[type="text"] {
        background: #ffffff !important;
        background-color: #ffffff !important;
        color: #111111 !important;
      }
      #ujFilterCriteriaTbody input[type="text"]:focus {
        background: #ffffff !important;
        background-color: #ffffff !important;
        color: #111111 !important;
        outline: 1px solid #7f9db9 !important;
      }
    </style>

    <!-- 1C Tabs Row (Screenshot 1) -->
    <div style="padding: 4px 6px 0 6px; background: #e5e2cf; border-bottom: 1px solid #b0af9f; display: flex; gap: 2px;">
      <button type="button" class="uj-filter-tab" id="ujTabOsnovnye" onclick="UniversalJournal.switchFilterTab('osnovnye')" 
              style="padding: 4px 10px; font-size: 11px; border: 1px solid #b0af9f; background: #dfdcce; cursor: pointer; display: flex; align-items: center; gap: 4px;">
        <span>📄</span><span data-i18n="filter.tab_main">Основные</span>
      </button>
      <button type="button" class="uj-filter-tab active" id="ujTabOtbor" onclick="UniversalJournal.switchFilterTab('otbor')" 
              style="padding: 4px 12px; font-size: 11px; font-weight: bold; border: 1px solid #b0af9f; border-bottom: none; background: #f0eee3; cursor: pointer; display: flex; align-items: center; gap: 4px; border-top: 2px solid #e28700;">
        <span>📑</span><span data-i18n="filter.tab_filter">Отбор</span>
      </button>
      <button type="button" class="uj-filter-tab" id="ujTabSort" onclick="UniversalJournal.switchFilterTab('sort')" 
              style="padding: 4px 10px; font-size: 11px; border: 1px solid #b0af9f; background: #dfdcce; cursor: pointer; display: flex; align-items: center; gap: 4px;">
        <span>📶</span><span data-i18n="filter.tab_sort">Сортировка</span>
      </button>
      <button type="button" class="uj-filter-tab" id="ujTabStyle" onclick="UniversalJournal.switchFilterTab('style')" 
              style="padding: 4px 10px; font-size: 11px; border: 1px solid #b0af9f; background: #dfdcce; cursor: pointer; display: flex; align-items: center; gap: 4px;">
        <span>🖌</span><span data-i18n="filter.tab_style">Условное оформление</span>
      </button>
      <button type="button" class="uj-filter-tab" id="ujTabGroup" onclick="UniversalJournal.switchFilterTab('group')" 
              style="padding: 4px 10px; font-size: 11px; border: 1px solid #b0af9f; background: #dfdcce; cursor: pointer; display: flex; align-items: center; gap: 4px;">
        <span>💬</span><span data-i18n="filter.tab_group">Группировка</span>
      </button>
    </div>

    <!-- Main Content Container (Two Panes: Available Fields + Conditions Table) -->
    <div id="ujFilterTabBodyOtbor" style="flex: 1; display: flex; overflow: hidden; padding: 6px; gap: 6px; background: #f0eee3; position: relative;">

      <!-- Left Pane: Доступные поля (Available Fields) -->
      <div id="ujFilterFieldsPane" style="width: 265px; flex-shrink: 0; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #7f9db9;">
        
        <!-- Left Action Header: 'Выбрать', 'Добавить', 'Удалить' -->
        <div style="padding: 3px 6px; background: #f0eee3; border-bottom: 1px solid #d4d0c8; display: flex; align-items: center; justify-content: space-between; gap: 4px;">
          <button type="button" class="btn-1c" onclick="(window.C1FilterComponent || UniversalJournal).addFilterCriterion((window.C1FilterComponent && window.C1FilterComponent.filterSelectedFieldKey) || UniversalJournal.filterSelectedFieldKey)" 
                  title="Добавить выбранное поле в отбор" data-i18n-title="filter.select_field_title" data-i18n="common.select" style="height: 22px; padding: 0 8px; font-size: 11px; font-weight: bold; cursor: pointer;">
            Выбрать
          </button>

          <div style="display: flex; align-items: center; gap: 3px;">
            <button type="button" class="btn-1c" id="ujFilterBtnAddField" onclick="(window.C1FilterComponent || UniversalJournal).openAddAvailableFieldDialog()" 
                    title="Добавить поле в список доступных" data-i18n-title="filter.add_available_field_title" 
                    style="height: 22px; padding: 0 6px; font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 3px;">
              <span style="color: #2e7d32; font-weight: bold; font-size: 12px; line-height: 1;">➕</span>
              <span data-i18n="common.add">Добавить</span>
            </button>

            <button type="button" class="btn-1c" id="ujFilterBtnRemoveField" onclick="(window.C1FilterComponent || UniversalJournal).removeSelectedAvailableField()" 
                    title="Удалить выбранное поле из доступных" data-i18n-title="filter.remove_available_field_title" 
                    style="height: 22px; padding: 0 6px; font-size: 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; color: #c62828;">
              <span style="font-size: 11px; line-height: 1;">❌</span>
              <span data-i18n="common.delete">Удалить</span>
            </button>
          </div>
        </div>

        <!-- Available Fields Title -->
        <div style="padding: 2px 6px; background: #e5e2cf; border-bottom: 1px solid #b0af9f; font-weight: bold; font-size: 10px; color: #444;" data-i18n="filter.available_fields">
          Доступные поля
        </div>

        <!-- Available Fields Scrollable List -->
        <div id="ujFilterAvailFieldsList" style="flex: 1; overflow-y: auto; background: #ffffff;">
          <!-- Populated dynamically via JS -->
        </div>

      </div>

      <!-- Right Pane: Отбор Criteria Table & Actions -->
      <div id="ujFilterPaneSplitter" role="separator" aria-label="Изменить ширину доступных полей" aria-orientation="vertical" tabindex="0"></div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #7f9db9; overflow: hidden; position: relative;">
        
        <!-- Right Pane Toolbar (➕, ❌, ⇧, ⇩, Очистить) -->
        <div style="padding: 3px 6px; background: #f0eee3; border-bottom: 1px solid #d4d0c8; display: flex; align-items: center; gap: 4px;">
          <button type="button" class="btn-1c" onclick="UniversalJournal.addFilterCriterion(UniversalJournal.filterSelectedFieldKey)" 
                  title="Добавить новый элемент" data-i18n-title="filter.add_condition_title" style="height: 22px; padding: 0 6px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer;">
            <span style="color: #2e7d32; font-weight: bold;">➕</span>
            <span style="font-size: 11px;" data-i18n="filter.add_condition">Добавить новый элемент</span>
          </button>

          <div style="height: 16px; width: 1px; background: #b0af9f; margin: 0 2px;"></div>

          <button type="button" class="btn-1c" style="height: 22px; padding: 0 6px; opacity: 0.6; cursor: not-allowed;" title="Сгруппировать условия" data-i18n="filter.group_conditions" disabled>
            Сгруппировать условия
          </button>

          <button type="button" class="btn-1c" onclick="UniversalJournal.removeFilterCriterion()" 
                  title="Удалить выбранный элемент (❌)" data-i18n-title="common.delete" style="height: 22px; padding: 0 6px; cursor: pointer; color: #c62828;">
            ❌
          </button>

          <button type="button" class="btn-1c" onclick="UniversalJournal.moveFilterCriterionUp()" 
                  title="Переместить вверх (⇧)" data-i18n-title="common.move_up" style="height: 22px; padding: 0 6px; cursor: pointer; font-weight: bold; color: #004080;">
            ⇧
          </button>

          <button type="button" class="btn-1c" onclick="UniversalJournal.moveFilterCriterionDown()" 
                  title="Переместить вниз (⇩)" data-i18n-title="common.move_down" style="height: 22px; padding: 0 6px; cursor: pointer; font-weight: bold; color: #004080;">
            ⇩
          </button>

          <div style="height: 16px; width: 1px; background: #b0af9f; margin: 0 2px;"></div>

          <button type="button" class="btn-1c" onclick="UniversalJournal.clearAllFilterCriteria()" 
                  title="Очистить все условия" data-i18n-title="filter.clear_all_title" data-i18n="common.clear" style="height: 22px; padding: 0 6px; cursor: pointer; font-size: 10px;">
            Очистить
          </button>
        </div>

        <!-- Root Tree Header 'Представление / Отбор' -->
        <div style="background: #e3dec9; border-bottom: 1px solid #b0af9f; padding: 3px 6px; font-weight: bold; font-size: 11px; display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: 5px;">
            <span>🔘</span>
            <span data-i18n="filter.root_otbor">Представление: <strong>Отбор</strong></span>
          </div>
          <div id="ujFilterCountSummary" style="font-weight: normal; font-size: 10px; color: #555;">
            0 элементов
          </div>
        </div>

        <!-- Conditions Table Container -->
        <div style="flex: 1; overflow: auto; background: #ffffff;" id="ujFilterTableContainer" onclick="UniversalJournal.hideFilterAutocomplete()">
          <table style="width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 11px;">
            <thead>
              <tr style="background: #f0eee3; border-bottom: 1px solid #b0af9f; height: 20px;">
                <th style="width: 28px; text-align: center; border: 1px solid #d4d0c8;">
                  <input type="checkbox" checked title="Отметить все / Снять все" onclick="UniversalJournal.checkAllFilterCriteria(this.checked)">
                </th>
                <th style="width: 170px; text-align: left; padding: 2px 6px; border: 1px solid #d4d0c8;" data-i18n="filter.col_field">Поле</th>
                <th style="width: 140px; text-align: left; padding: 2px 6px; border: 1px solid #d4d0c8;" data-i18n="filter.col_comparison">Вид сравнения</th>
                <th style="text-align: left; padding: 2px 6px; border: 1px solid #d4d0c8;" data-i18n="filter.col_value">Значение</th>
              </tr>
            </thead>
            <tbody id="ujFilterCriteriaTbody">
              <!-- Populated dynamically via JS without full DOM recreation -->
            </tbody>
          </table>
        </div>

        <!-- 1C Live Autocomplete / Search Dropdown Popup Container -->
        <div id="ujFilterAutocompletePopup" style="display: none; position: absolute; z-index: 500; background: #ffffff; border: 1px solid #7f9db9; box-shadow: 0 4px 14px rgba(0,0,0,0.3); max-height: 220px; width: 280px; overflow-y: auto; font-family: Tahoma, sans-serif; font-size: 11px;">
          <!-- Suggestions injected here -->
        </div>

      </div>

    </div>

    <!-- Placeholder for Other Tabs -->
    <div id="ujFilterTabBodyOther" style="display: none; flex: 1; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #7f9db9; color: #666; font-size: 12px; flex-direction: column; gap: 8px; margin: 6px;">
      <span style="font-size: 28px;">⚙️</span>
      <span id="ujFilterTabOtherLabel" data-i18n="filter.tab_other_hint">Вкладка доступна через основную таблицу журнала.</span>
      <button type="button" class="btn-1c" onclick="UniversalJournal.switchFilterTab('otbor')" style="height: 24px; padding: 0 12px;" data-i18n="filter.return_to_otbor">Вернуться к отбору</button>
    </div>

    <!-- Footer Buttons (Authentic 1C Golden Button) -->
    <div style="padding: 6px 10px; background: #e5e2cf; border-top: 1px solid #b0af9f; display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; gap: 6px;">
        <button type="button" class="btn-1c" onclick="UniversalJournal.openPresetSaveModal()" title="Сохранить эти условия в настройку" data-i18n-title="uj.save_preset_title" style="height: 24px; padding: 0 8px; display: inline-flex; align-items: center; gap: 4px;">
          <span>💾</span>
          <span data-i18n="filter.save_settings">Сохранить настройку...</span>
        </button>
      </div>
      <div style="display: flex; gap: 6px; align-items: center;">
        <button id="ujFilterConfirmButton" type="button" onclick="C1FilterComponent.finishFilterEditing()"
                style="height: 24px; min-width: 140px; font-weight: bold; background: #ffe3a8; border: 1px solid #c99c47; color: #111; cursor: pointer; border-radius: 2px; padding: 0 14px; box-shadow: inset 0 1px 0 #fff;" data-i18n="filter.finish_edit">
          Завершить редактирование
        </button>
        <button type="button" class="btn-1c" onclick="UniversalJournal.closeFilterModal()" style="height: 24px; min-width: 70px;" data-i18n="common.cancel">
          Отмена
        </button>
        <button type="button" class="btn-1c" style="height: 24px; width: 24px; font-weight: bold;" title="Справка" data-i18n-title="common.help">
          ?
        </button>
      </div>
    </div>

  </div>

</div>

<!-- ========================================================
     1C:ENTERPRISE - ВЫБОР ПОЛЯ MODAL (3 NÖQTƏ MODALI)
     ======================================================== -->
<div id="ujFieldSelectModalOverlay" class="modal-overlay-1c" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 999999; align-items: center; justify-content: center;" onclick="if(event.target === this) UniversalJournal.closeFieldSelectModal()">
  <div id="ujFieldSelectWindow" class="window-1c" role="dialog" aria-label="Выбор поля" style="width: 420px; height: 540px; max-width: 95vw; max-height: 90vh; display: flex; flex-direction: column; background: #ece9d8; border: 2px solid #0055ea; box-shadow: 0 8px 24px rgba(0,0,0,0.4);" onclick="event.stopPropagation()">
    
    <!-- Titlebar -->
    <div id="ujFieldSelectTitlebar" style="background: linear-gradient(to bottom, #0058ee, #3593ff 50%, #288eff 51%, #0053e6); color: #ffffff; padding: 3px 6px; font-weight: bold; font-size: 11px; display: flex; align-items: center; justify-content: space-between; user-select: none;">
      <div style="display: flex; align-items: center; gap: 4px;">
        <span>🏷️</span>
        <span data-i18n="field_select.title">Выбор поля</span>
      </div>
      <button type="button" class="btn-1c" onclick="UniversalJournal.closeFieldSelectModal()" style="width: 18px; height: 18px; padding: 0; font-size: 11px; font-weight: bold; line-height: 14px; background: #d74435; color: #fff; border: 1px solid #900; cursor: pointer;" title="Закрыть" data-i18n-title="common.close">✕</button>
    </div>

    <!-- Toolbar: Выбрать, Отмена & Поиск -->
    <div style="padding: 4px 6px; background: #f0eee3; border-bottom: 1px solid #b0af9f; display: flex; flex-direction: column; gap: 4px;">
      <div style="display: flex; align-items: center; gap: 4px;">
        <button type="button" class="btn-1c" onclick="UniversalJournal.confirmModalFieldSelection()" style="height: 22px; padding: 0 10px; font-weight: bold; background: #ffe3a8; border: 1px solid #c99c47; color: #111; cursor: pointer;" data-i18n="common.select">
          Выбрать
        </button>
        <button type="button" class="btn-1c" onclick="UniversalJournal.closeFieldSelectModal()" style="height: 22px; padding: 0 8px; cursor: pointer;" data-i18n="common.cancel">
          Отмена
        </button>
      </div>
      <input type="text" id="ujFieldSelectSearchInput" placeholder="Поиск поля..." data-i18n-placeholder="field_select.search_placeholder"
             style="width: 100%; height: 21px; padding: 1px 4px; font-size: 11px; border: 1px solid #7f9db9; outline: none; background: #ffffff;"
             oninput="UniversalJournal.filterFieldSelectModalList(this.value)"
             onkeydown="UniversalJournal.onFieldSelectModalKeydown(event)">
    </div>

    <!-- Available Fields Title -->
    <div style="padding: 2px 6px; background: #e5e2cf; border-bottom: 1px solid #b0af9f; font-weight: bold; font-size: 10px; color: #444;" data-i18n="filter.available_fields_colon">
      Доступные поля:
    </div>

    <!-- Available Fields Scrollable List -->
    <div id="ujFieldSelectModalList" style="flex: 1; overflow-y: auto; background: #ffffff; border-bottom: 1px solid #b0af9f;">
      <!-- Populated dynamically via UniversalJournal.renderFieldSelectModalList -->
    </div>

    <!-- Footer -->
    <div style="padding: 4px 6px; background: #e5e2cf; display: flex; justify-content: flex-end; align-items: center; gap: 4px;">
      <button type="button" class="btn-1c" onclick="UniversalJournal.closeFieldSelectModal()" style="height: 22px; min-width: 60px; cursor: pointer;" data-i18n="common.close">
        Закрыть
      </button>
      <button type="button" class="btn-1c" style="height: 22px; width: 22px; font-weight: bold;" title="Справка" data-i18n-title="common.help">
        ?
      </button>
    </div>

  </div>
</div>

<!-- ========================================================
     1C:ENTERPRISE - ДОБАВЛЕНИЕ ДОСТУПНОГО ПОЛЯ (ADD AVAILABLE FIELD MODAL)
     ======================================================== -->
<style>
#ujAddAvailFieldList {min-height:0;overflow:auto;}
.c1-field-table {width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:12px;color:#222;}
.c1-field-table th,.c1-field-table td {padding:7px 9px;border-right:1px solid #e0dfd4;border-bottom:1px solid #e0dfd4;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.c1-field-table thead th {position:sticky;top:0;z-index:2;background:#e7e4d2;border-bottom:1px solid #aaa78f;font-weight:600;}
.c1-field-group th {background:#f0eee3;padding:0;}
.c1-field-group button {display:block;width:100%;padding:7px 9px;text-align:left;border:0;background:transparent;font:inherit;font-weight:600;cursor:pointer;color:inherit;}
.c1-field-group span {font-weight:normal;color:#777;}
.c1-field-row {cursor:pointer;background:#fff;}
.c1-field-row:hover {background:#f1f6fc;}
.c1-field-row.selected {background:#dbeaff;outline:1px solid #8bb4e9;outline-offset:-1px;}
.c1-field-table .c1-field-check {text-align:center;}
.c1-field-support {display:inline-block;padding:2px 5px;border-radius:3px;font-size:11px;}
.c1-field-support.supported {color:#22683b;background:#edf6ee;}
.c1-field-support.unsupported {color:#94601d;background:#fff5e4;}
</style>
<div id="ujAddAvailFieldModalOverlay" class="modal-overlay-1c" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 1000000; align-items: center; justify-content: center;" onclick="if(event.target === this) (window.C1FilterComponent || UniversalJournal).closeAddAvailableFieldDialog()">
  <div id="ujAddAvailFieldWindow" class="window-1c" role="dialog" aria-label="Добавление доступного поля" style="width: 960px; height: 660px; max-width: 95vw; max-height: 90vh; display: flex; flex-direction: column; background: #ece9d8; border: 2px solid #0055ea; box-shadow: 0 8px 24px rgba(0,0,0,0.4);" onclick="event.stopPropagation()">
    
    <!-- Titlebar -->
    <div id="ujAddAvailFieldTitlebar" ondblclick="if(window.MdiManager) MdiManager.toggleMaximize('ujAddAvailFieldModalOverlay')" style="background: linear-gradient(to bottom, #0058ee, #3593ff 50%, #288eff 51%, #0053e6); color: #ffffff; padding: 4px 8px; font-weight: bold; font-size: 11px; display: flex; align-items: center; justify-content: space-between; user-select: none; cursor: move;">
      <div style="display: flex; align-items: center; gap: 5px;">
        <span>➕</span>
        <span id="ujAddAvailFieldTitleText" class="mdi-win-title-text" data-i18n-skip style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Выбор поля для отбора</span>
      </div>
      <div class="mdi-window-controls" style="display:flex;gap:3px;" onmousedown="event.stopPropagation()" ondblclick="event.stopPropagation()">
      <button type="button" class="mdi-win-btn mdi-win-btn-min" title="Bük" onclick="if(window.MdiManager) MdiManager.minimizeWindow('ujAddAvailFieldModalOverlay')">_</button>
      <button type="button" class="mdi-win-btn mdi-win-btn-max" title="Böyüt / Bərpa et" onclick="if(window.MdiManager) MdiManager.toggleMaximize('ujAddAvailFieldModalOverlay')">□</button>
      <button type="button" class="btn-1c" onclick="(window.C1FilterComponent || UniversalJournal).closeAddAvailableFieldDialog()" style="width: 18px; height: 18px; padding: 0; font-size: 11px; font-weight: bold; line-height: 14px; background: #d74435; color: #fff; border: 1px solid #900; cursor: pointer;" title="Закрыть" data-i18n-title="common.close">✕</button>
      </div>
    </div>

    <!-- Search & Quick Action Toolbar -->
    <div style="padding: 6px; background: #f0eee3; border-bottom: 1px solid #b0af9f; display: flex; flex-direction: column; gap: 5px;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <button id="ujAddAvailFieldAddButton" type="button" class="btn-1c" onclick="(window.C1FilterComponent || UniversalJournal).confirmAddAvailableField()" style="height: 24px; padding: 0 12px; font-weight: bold; background: #ffe3a8; border: 1px solid #c99c47; color: #111; cursor: pointer;" data-i18n="common.add">
          Добавить
        </button>
        <button type="button" class="btn-1c" onclick="(window.C1FilterComponent || UniversalJournal).closeAddAvailableFieldDialog()" style="height: 24px; padding: 0 10px; cursor: pointer;" data-i18n="common.cancel">
          Отмена
        </button>
        <div style="flex: 1;"></div>
        <button type="button" class="btn-1c" onclick="(window.C1FilterComponent || UniversalJournal).toggleCustomFieldInput()" style="height: 24px; padding: 0 8px; font-size: 11px; cursor: pointer;" title="Добавить поле вручную по коду">
          ✏️ <span data-i18n="filter.custom_field_btn">Произвольное поле...</span>
        </button>
      </div>

      <!-- Search Input -->
      <div style="position: relative; display: flex; align-items: center;">
        <span style="position: absolute; left: 6px; font-size: 11px; color: #777; pointer-events: none;">🔍</span>
        <input type="text" id="ujAddAvailFieldSearchInput" placeholder="Быстрый поиск поля..." data-i18n-placeholder="filter.field_search_placeholder"
               style="width: 100%; height: 23px; padding: 1px 6px 1px 24px; font-size: 11px; border: 1px solid #7f9db9; outline: none; background: #ffffff;"
               oninput="(window.C1FilterComponent || UniversalJournal).filterAddAvailableFieldList(this.value)"
               onkeydown="(window.C1FilterComponent || UniversalJournal).onAddAvailableFieldKeydown(event)">
      </div>

      <!-- Custom Field Input Panel (Hidden by default) -->
      <div id="ujCustomFieldPanel" style="display: none; background: #ffffff; border: 1px solid #b0af9f; padding: 6px; margin-top: 2px;">
        <div style="font-size: 10px; font-weight: bold; color: #333; margin-bottom: 4px;">Новое поле (Код и Название):</div>
        <div style="display: flex; gap: 4px; align-items: center;">
          <input type="text" id="ujCustomFieldKey" placeholder="Код (например: organization)" style="flex: 1; height: 22px; font-size: 11px; padding: 0 4px; border: 1px solid #7f9db9;">
          <input type="text" id="ujCustomFieldLabel" placeholder="Название (например: Организация)" style="flex: 1.2; height: 22px; font-size: 11px; padding: 0 4px; border: 1px solid #7f9db9;">
          <select id="ujCustomFieldType" style="height: 22px; font-size: 11px; border: 1px solid #7f9db9;">
            <option value="text">Текст</option>
            <option value="number">Число</option>
            <option value="date">Дата</option>
            <option value="boolean">Булево</option>
          </select>
          <button type="button" class="btn-1c" onclick="(window.C1FilterComponent || UniversalJournal).addCustomFieldSubmit()" style="height: 22px; padding: 0 8px; font-weight: bold; background: #2e7d32; color: #fff; border: 1px solid #1b5e20; cursor: pointer;">
            + OK
          </button>
        </div>
      </div>
    </div>

    <!-- Available Fields Header -->
    <div style="padding: 3px 6px; background: #e5e2cf; border-bottom: 1px solid #b0af9f; font-weight: bold; font-size: 10px; color: #444; display: flex; justify-content: space-between; align-items: center;">
      <span data-i18n="filter.available_catalog_fields">Все доступные поля 1С:</span>
      <span id="ujAddAvailFieldCount" data-i18n-skip style="font-weight: normal; color: #666; font-size: 10px;"></span>
    </div>

    <!-- Scrollable Field List -->
    <div id="ujAddAvailFieldList" style="flex: 1; overflow-y: auto; background: #ffffff; border-bottom: 1px solid #b0af9f;">
      <!-- Populated dynamically via JS -->
    </div>

    <!-- Footer -->
    <div style="padding: 4px 8px; background: #e5e2cf; display: flex; justify-content: space-between; align-items: center;">
      <button type="button" class="btn-1c" onclick="(window.C1FilterComponent || UniversalJournal).resetAvailableFieldsToDefault()" style="height: 22px; font-size: 10px; cursor: pointer;" title="Сбросить список доступных полей до стандартных">
        🔄 <span data-i18n="filter.reset_default_fields">Сбросить к стандартным</span>
      </button>
      <button type="button" class="btn-1c" onclick="(window.C1FilterComponent || UniversalJournal).closeAddAvailableFieldDialog()" style="height: 22px; min-width: 65px; cursor: pointer;" data-i18n="common.close">
        Закрыть
      </button>
    </div>

  </div>
</div>
