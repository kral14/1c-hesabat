<!-- ========================================================
     1C:ENTERPRISE - DIAGNOSTICS & DEBUG MODAL (ДИАГНОСТИКА)
     ======================================================== -->
<div id="ujDiagnosticsModalOverlay" class="modal-overlay-1c" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 9999999; align-items: center; justify-content: center;" onclick="if(event.target === this) UniversalJournal.closeDebugDiagnosticsModal()">
  <div class="window-1c" style="width: 780px; height: 560px; max-width: 96vw; max-height: 94vh; display: flex; flex-direction: column; background: #ece9d8; border: 2px solid #0055ea; box-shadow: 0 10px 30px rgba(0,0,0,0.5);" onclick="event.stopPropagation()">
    
    <!-- Titlebar -->
    <div style="background: linear-gradient(to bottom, #0058ee, #3593ff 50%, #288eff 51%, #0053e6); color: #ffffff; padding: 4px 8px; font-weight: bold; font-size: 11px; display: flex; align-items: center; justify-content: space-between; user-select: none;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <span style="font-size: 14px;">🩺</span>
        <span style="letter-spacing: 0.3px;">Диагностика отбора и журнала документов (Отладчик)</span>
      </div>
      <button type="button" class="btn-1c" onclick="UniversalJournal.closeDebugDiagnosticsModal()" 
              style="width: 18px; height: 18px; padding: 0; font-size: 11px; font-weight: bold; line-height: 14px; background: #d74435; color: #fff; border: 1px solid #900; cursor: pointer;" title="Закрыть">✕</button>
    </div>

    <!-- Toolbar: Copy, Refresh, Quick Status -->
    <div style="padding: 5px 8px; background: #f0eee3; border-bottom: 1px solid #b0af9f; display: flex; align-items: center; justify-content: space-between; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <button type="button" class="btn-1c" onclick="UniversalJournal.copyDiagnosticsToClipboard()" 
                style="height: 22px; padding: 0 10px; font-weight: bold; background: #ffe3a8; border: 1px solid #c99c47; color: #111; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;">
          <span>📋</span><span>Скопировать отчет</span>
        </button>
        <button type="button" class="btn-1c" onclick="UniversalJournal.executeSearchOrFilter(); setTimeout(() => UniversalJournal.renderDebugDiagnosticsContent(), 400);" 
                style="height: 22px; padding: 0 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;">
          <span>🔄</span><span>Обновить данные</span>
        </button>
      </div>

      <div id="diagHeaderBadge" style="font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 3px; background: #e0e0e0; color: #333;">
        Загрузка...
      </div>
    </div>

    <!-- Body Scrollable Content -->
    <div id="ujDiagnosticsBody" style="flex: 1; overflow-y: auto; padding: 8px; background: #ffffff; display: flex; flex-direction: column; gap: 10px; font-family: Tahoma, Segoe UI, sans-serif; font-size: 11px; color: #111111;">
      <!-- Populated dynamically via UniversalJournal.renderDebugDiagnosticsContent -->
    </div>

    <!-- Footer -->
    <div style="padding: 6px 10px; background: #e5e2cf; border-top: 1px solid #b0af9f; display: flex; justify-content: space-between; align-items: center;">
      <div style="font-size: 10px; color: #666;">
        <span>ℹ️ Этот отчет детально показывает, почему поиск пустой или возникла ошибка.</span>
      </div>
      <button type="button" class="btn-1c" onclick="UniversalJournal.closeDebugDiagnosticsModal()" style="height: 23px; min-width: 80px; font-size: 11px;">
        Закрыть
      </button>
    </div>

  </div>
</div>
