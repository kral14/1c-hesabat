<!-- ========================================================
     1C:ENTERPRISE - DIAGNOSTICS & DEBUG MDI WINDOW (ДИАГНОСТИКА)
     templates/components/diagnostics_modal.html
     ======================================================== -->

<div class="mdi-window" id="ujDiagnosticsWindow" style="display: none; top: 55px; left: 100px; width: 820px; height: 560px; min-width: 580px; min-height: 380px; z-index: 140;" onmousedown="MdiManager.activateWindow('ujDiagnosticsWindow')">
  
  <!-- Window Titlebar (1C MDI Standard) -->
  <div class="mdi-window-header" ondblclick="MdiManager.toggleMaximize('ujDiagnosticsWindow')">
    <div class="mdi-win-title-left">
      <span class="mdi-win-icon">🩺</span>
      <span class="mdi-win-title-text" id="ujDiagnosticsWindowTitle" data-i18n="diag.title">Диагностика отбора и журнала документов (Отладчик)</span>
    </div>
    <div class="mdi-win-controls">
      <button class="mdi-win-btn mdi-win-btn-min" title="Qatla" onclick="MdiManager.minimizeWindow('ujDiagnosticsWindow')" onmousedown="event.stopPropagation()">_</button>
      <button class="mdi-win-btn mdi-win-btn-max" title="Böyüt / Bərpa et" onclick="MdiManager.toggleMaximize('ujDiagnosticsWindow')" onmousedown="event.stopPropagation()">□</button>
      <button class="mdi-win-btn mdi-win-btn-close" title="Bağla" onclick="UniversalJournal.closeDebugDiagnosticsModal()" onmousedown="event.stopPropagation()">✕</button>
    </div>
  </div>

  <!-- Window Body -->
  <div class="mdi-window-body" style="background-color: #ece9d8; display: flex; flex-direction: column; height: 100%; overflow: hidden; font-family: Tahoma, 'MS Sans Serif', Arial, sans-serif; font-size: 11px;">

    <!-- Toolbar: Copy, Refresh, Quick Status -->
    <div style="padding: 4px 8px; background: #f0eee3; border-bottom: 1px solid #b0af9f; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0;">
      <div style="display: flex; align-items: center; gap: 6px;">
        <button type="button" class="btn-1c" onclick="UniversalJournal.copyDiagnosticsToClipboard()" 
                style="height: 22px; padding: 0 10px; font-weight: bold; background: #ffe3a8; border: 1px solid #c99c47; color: #111; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;"
                title="Отчет в буфер обмена">
          <span>📋</span><span data-i18n="diag.copy">Скопировать отчет</span>
        </button>
        <button type="button" class="btn-1c" onclick="UniversalJournal.executeSearchOrFilter(); setTimeout(() => UniversalJournal.renderDebugDiagnosticsContent(), 400);" 
                style="height: 22px; padding: 0 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;"
                title="Обновить данные и статус">
          <span>🔄</span><span data-i18n="diag.refresh">Обновить данные</span>
        </button>
      </div>

      <div id="diagHeaderBadge" style="font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 3px; background: #e0e0e0; color: #333;">
        Загрузка...
      </div>
    </div>

    <!-- Body Scrollable Content -->
    <div id="ujDiagnosticsBody" style="flex: 1; overflow-y: auto; padding: 8px; background: #ffffff; display: flex; flex-direction: column; gap: 10px; font-family: Tahoma, Segoe UI, sans-serif; font-size: 11px; color: #111111;">
      <!-- Populated dynamically via UniversalJournal.renderDebugDiagnosticsContent -->
    </div>

    <!-- Footer -->
    <div style="padding: 5px 10px; background: #e5e2cf; border-top: 1px solid #b0af9f; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;">
      <div style="font-size: 10px; color: #666;">
        <span data-i18n="diag.note">ℹ️ Этот отчет детально показывает, почему поиск пустой или возникла ошибка.</span>
      </div>
      <button type="button" class="btn-1c" onclick="UniversalJournal.closeDebugDiagnosticsModal()" data-i18n="common.close" style="height: 22px; min-width: 75px; font-size: 11px; font-weight: bold; background: #ece9d8; border: 1px solid #7f9db9; cursor: pointer;">
        Закрыть
      </button>
    </div>

  </div>
</div>
