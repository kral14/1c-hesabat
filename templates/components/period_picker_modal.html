<!-- ========================================================
     1C:ENTERPRISE NATIVE PERIOD PICKER DIALOG (Выберите период)
     templates/components/period_picker_modal.html
     ======================================================== -->

<div class="modal-overlay-1c" id="periodPickerModalOverlay" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999;" onmousedown="PeriodPicker.bringToFront()">
  <div class="modal-window-1c" id="periodPickerModal" style="position: absolute; width: 530px; pointer-events: auto; background: #f0eee3; border: 1px solid #7f9db9; box-shadow: 0 4px 18px rgba(0,0,0,0.35); font-family: Tahoma, 'MS Sans Serif', Arial, sans-serif; font-size: 11px;">
    
    <!-- Header -->
    <div class="modal-header-1c" id="periodPickerHeader" style="background: linear-gradient(to bottom, #fdfdfe, #d6d9e0); padding: 4px 8px; border-bottom: 1px solid #a0a0a0; display: flex; align-items: center; justify-content: space-between; cursor: move; user-select: none;">
      <div style="font-weight: bold; color: #000; font-size: 11px; display: flex; align-items: center; gap: 5px;">
        <span>📅</span>
        <span>Выберите период</span>
      </div>
      <div style="display: flex; gap: 2px;">
        <button type="button" class="window-btn-close" onclick="PeriodPicker.close()" style="width: 17px; height: 17px; border: 1px solid #7f9db9; background: #e5e2cf; font-size: 10px; cursor: pointer; line-height: 1;">✕</button>
      </div>
    </div>

    <!-- Body -->
    <div style="padding: 10px 14px 12px 14px; background: #f0eee3;">
      
      <!-- Top Date Inputs Row -->
      <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 8px;">
        
        <!-- Start Date -->
        <div style="display: inline-flex; align-items: center; background: #fff; border: 1px solid #7f9db9; height: 21px; padding: 0 2px;">
          <input type="text" id="ppStartDateInput" placeholder=".. .." style="width: 78px; height: 18px; border: none; outline: none; font-size: 11px; font-family: Tahoma, sans-serif; padding: 0 2px;" onchange="PeriodPicker.onManualInputChange('start')" onkeydown="PeriodPicker.onInputKeyDown(event, 'start')" onblur="PeriodPicker.onInputBlur('start')">
          <button type="button" class="period-cal-btn" onclick="PeriodPicker.openMiniCal('start', this)" title="Календарь" style="background: none; border: none; cursor: pointer; padding: 0 2px; font-size: 10px; color: #555;">📅</button>
          <button type="button" onclick="PeriodPicker.clearInput('start')" title="Очистить" style="background: none; border: none; cursor: pointer; padding: 0 2px; font-size: 10px; color: #888; font-weight: bold;">✕</button>
        </div>

        <span style="font-weight: bold; color: #555;">-</span>

        <!-- End Date -->
        <div style="display: inline-flex; align-items: center; background: #fff; border: 1px solid #7f9db9; height: 21px; padding: 0 2px;">
          <input type="text" id="ppEndDateInput" placeholder=".. .." style="width: 78px; height: 18px; border: none; outline: none; font-size: 11px; font-family: Tahoma, sans-serif; padding: 0 2px;" onchange="PeriodPicker.onManualInputChange('end')" onkeydown="PeriodPicker.onInputKeyDown(event, 'end')" onblur="PeriodPicker.onInputBlur('end')">
          <button type="button" class="period-cal-btn" onclick="PeriodPicker.openMiniCal('end', this)" title="Календарь" style="background: none; border: none; cursor: pointer; padding: 0 2px; font-size: 10px; color: #555;">📅</button>
          <button type="button" onclick="PeriodPicker.clearInput('end')" title="Очистить" style="background: none; border: none; cursor: pointer; padding: 0 2px; font-size: 10px; color: #888; font-weight: bold;">✕</button>
        </div>

        <!-- Clear period link -->
        <a href="javascript:void(0)" onclick="PeriodPicker.clearPeriod()" style="color: #004080; text-decoration: underline; margin-left: 10px; font-size: 11px;">Очистить период</a>
      </div>

      <!-- 3-Year Months Matrix Container -->
      <div style="border: 1px solid #a8a594; background: #fdfcf7; padding: 10px 12px; margin-bottom: 8px; border-radius: 2px;">
        
        <!-- Year Navigator Header -->
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
          <button type="button" onclick="PeriodPicker.prevYears()" title="Предыдущие годы" style="border: 1px solid #7f9db9; background: #e5e2cf; width: 20px; height: 20px; cursor: pointer; font-size: 10px;">◀</button>
          <div style="display: flex; flex: 1; justify-content: space-around; font-weight: bold; font-size: 12px; color: #111;">
            <span id="ppYearLabel0">2025</span>
            <span id="ppYearLabel1">2026</span>
            <span id="ppYearLabel2">2027</span>
          </div>
          <button type="button" onclick="PeriodPicker.nextYears()" title="Следующие годы" style="border: 1px solid #7f9db9; background: #e5e2cf; width: 20px; height: 20px; cursor: pointer; font-size: 10px;">▶</button>
        </div>

        <!-- 3 Years Columns -->
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;" id="ppYearsGrid">
          <!-- Rendered dynamically by PeriodPicker.renderGrid() -->
        </div>

      </div>

      <!-- Presets and Remember row -->
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
        <div>
          <label style="display: flex; align-items: center; gap: 5px; font-size: 11px; cursor: pointer; color: #222;">
            <input type="checkbox" id="ppRememberPeriod" checked style="cursor: pointer;">
            <span>Запомнить выбранный период</span>
          </label>
          <div style="margin-top: 4px;">
            <a href="javascript:void(0)" onclick="PeriodPicker.togglePresets()" style="color: #004080; text-decoration: underline; font-size: 11px;">Показать стандартные периоды</a>
          </div>
        </div>
      </div>

      <!-- Standard presets dropdown menu (hidden by default) -->
      <div id="ppPresetsMenu" style="display: none; background: #fff; border: 1px solid #7f9db9; padding: 6px; box-shadow: 2px 2px 8px rgba(0,0,0,0.2); margin-bottom: 10px; max-height: 120px; overflow-y: auto;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 11px;">
          <a href="javascript:void(0)" onclick="PeriodPicker.applyPreset('today')" style="color: #003366; text-decoration: none; padding: 2px 4px;">Сегодня</a>
          <a href="javascript:void(0)" onclick="PeriodPicker.applyPreset('yesterday')" style="color: #003366; text-decoration: none; padding: 2px 4px;">Вчера</a>
          <a href="javascript:void(0)" onclick="PeriodPicker.applyPreset('this_week')" style="color: #003366; text-decoration: none; padding: 2px 4px;">Текущая неделя</a>
          <a href="javascript:void(0)" onclick="PeriodPicker.applyPreset('this_month')" style="color: #003366; text-decoration: none; padding: 2px 4px;">Текущий месяц</a>
          <a href="javascript:void(0)" onclick="PeriodPicker.applyPreset('this_quarter')" style="color: #003366; text-decoration: none; padding: 2px 4px;">Текущий квартал</a>
          <a href="javascript:void(0)" onclick="PeriodPicker.applyPreset('this_year')" style="color: #003366; text-decoration: none; padding: 2px 4px;">С начала года</a>
          <a href="javascript:void(0)" onclick="PeriodPicker.applyPreset('all')" style="color: #003366; text-decoration: none; padding: 2px 4px;">Весь период (Очистить)</a>
        </div>
      </div>

      <!-- Footer Buttons -->
      <div style="display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding-top: 6px; border-top: 1px solid #d5d3c3;">
        <button type="button" class="btn-1c btn-1c-primary" onclick="PeriodPicker.confirm()" style="min-width: 82px; height: 24px; font-weight: bold; background: linear-gradient(to bottom, #ffea88, #d8a020); border: 1px solid #7c6817; color: #000; cursor: pointer;">Выбрать</button>
        <button type="button" class="btn-1c" onclick="PeriodPicker.close()" style="min-width: 70px; height: 24px; cursor: pointer;">Отмена</button>
      </div>

    </div>

  </div>
</div>
