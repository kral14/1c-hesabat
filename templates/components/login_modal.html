<!-- ========================================================
     1C:ENTERPRISE UNIVERSAL REPORT - LOGIN & SESSION MODAL
     login_modal.html
     ======================================================== -->

<div id="loginModalOverlay" class="modal-overlay-1c">
  <div class="settings-window" style="max-width: 480px; height: auto; max-height: 90vh;" onmousedown="MdiManager.bringModalToFront(document.getElementById('loginModalOverlay'))">
    
    <!-- Window Header -->
    <div class="settings-header">
      <div class="settings-header-title">
        <div class="settings-header-icon" style="background: #c00000;">1C</div>
        <span>1C:Enterprise - Giriş və Baza Seçimi</span>
      </div>
      <button class="window-btn-sys window-btn-close" onclick="closeLoginModal()">✕</button>
    </div>

    <!-- Window Body -->
    <div class="settings-body" style="padding: 16px;">
      
      <!-- Base Selection -->
      <div style="margin-bottom: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <label style="font-weight: bold; color: #222; margin: 0;">
            1C İnformasiya Bazası:
          </label>
          <span id="modalCustomBadge" style="font-size: 10px; color: #666;"></span>
        </div>
        <div style="display: flex; gap: 6px;">
          <select id="modalBaseSelect" class="input-1c" style="flex: 1; height: 26px;" onchange="onModalBaseChange()">
            <option value="">Bazalar axtarılır...</option>
          </select>
          <button type="button" class="btn-1c" id="modalBtnDeleteBase" onclick="deleteCurrentBase()" title="Seçilmiş bazanı siyahıdan sil" style="height: 26px; padding: 0 10px; color: #b30000; font-weight: bold; white-space: nowrap; display: flex; align-items: center; gap: 4px;">
            <span>🗑️ Sil</span>
          </button>
        </div>
      </div>

      <!-- Advanced Server & Ref (Manual Entry & Custom Bases) -->
      <div style="margin-bottom: 12px; background: #f4f2e8; padding: 10px; border: 1px solid #c0bfae; border-radius: 3px;">
        <div style="font-size: 11px; font-weight: bold; color: #333; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between;">
          <span>⚙️ Baza Parametrləri (Manual Daxiletmə):</span>
        </div>
        <div style="margin-bottom: 6px;">
          <label style="font-size: 10px; color: #555; display: block; margin-bottom: 2px;">Baza Adı / Təsvir (Seçim siyahısında görünən ad):</label>
          <input type="text" id="modalCustomTitle" class="input-1c" style="width: 100%; height: 24px;" placeholder="Məs: Aztrade Əsas Test Bazası">
        </div>
        <div style="display: flex; gap: 8px; margin-bottom: 8px;">
          <div style="flex: 1;">
            <label style="font-size: 10px; color: #555; display: block; margin-bottom: 2px;">Server (Srvr):</label>
            <input type="text" id="modalCustomServer" class="input-1c" style="width: 100%; height: 24px;" value="Test1C" placeholder="Server adı və ya IP">
          </div>
          <div style="flex: 1;">
            <label style="font-size: 10px; color: #555; display: block; margin-bottom: 2px;">Baza (Ref):</label>
            <input type="text" id="modalCustomRef" class="input-1c" style="width: 100%; height: 24px;" value="Aztrade_test3" placeholder="Baza adı">
          </div>
        </div>
        <div style="display: flex; gap: 6px;">
          <button type="button" class="btn-1c" onclick="addCustomBase()" style="flex: 1; height: 26px; font-weight: bold; background: #eaf3e5; border-color: #6a9b56; color: #1b5e20;">
            💾 Bazanı Əlavə Et / Yadda Saxla
          </button>
          <button type="button" class="btn-1c" onclick="reloadModalUsersForCustomDb()" style="height: 26px; padding: 0 12px;">
            🔄 İstifadəçiləri Yenilə
          </button>
        </div>
      </div>

      <!-- User Selection -->
      <div style="margin-bottom: 12px;">
        <label style="display: block; font-weight: bold; margin-bottom: 4px; color: #222;">
          İstifadəçi:
        </label>
        <select id="modalUserSelect" class="input-1c" style="width: 100%; height: 26px;">
          <option value="">İstifadəçilər yüklənir...</option>
        </select>
      </div>

      <!-- Password -->
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-weight: bold; margin-bottom: 4px; color: #222;">
          Şifrə:
        </label>
        <input type="password" id="modalPasswordInput" class="input-1c" style="width: 100%; height: 26px;" value="15963" autocomplete="new-password" data-lpignore="true" onkeydown="if(event.key==='Enter') submitLoginModal()">
      </div>

      <!-- Action Buttons -->
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn-1c primary" onclick="submitLoginModal()" style="padding: 4px 16px; height: 26px;">
          <span>Giriş et</span>
        </button>
        <button class="btn-1c" onclick="closeLoginModal()" style="padding: 4px 16px; height: 26px;">
          <span>Bağla</span>
        </button>
      </div>

    </div>

    <!-- Status Bar -->
    <div class="settings-footer" style="font-size: 10px; color: #555;">
      <span>Status: <b id="modalConnStatus">Hazır</b></span>
      <span id="modalActiveDbText">Test1C / Aztrade_test3</span>
    </div>

  </div>
</div>
